<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .image-loader {
            position: relative;
            width: 100%;
            height: 400px;
            background: #f0f0f0;
            overflow: hidden;
        }

        .loading-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #999;
            font-size: 16px;
        }

        .dissolve-on-load {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dissolve-on-load.loaded {
            opacity: 1;
        }

        .dissolve-on-load.loaded+.loading-placeholder {
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }
    </style>
</head>

<body>
    <div class="image-loader">
        <div class="loading-placeholder"></div>
        <img class="dissolve-on-load" src="image1.jpg" alt="圖片">
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const images = document.querySelectorAll('.dissolve-on-load');

            images.forEach(img => {
                // 預載入圖片
                const tempImg = new Image();
                tempImg.onload = function () {
                    img.classList.add('loaded');
                };
                tempImg.src = img.src;
            });
        });

    </script>
</body>

</html>
