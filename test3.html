<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .minimal-shadow {
  position: relative;
  width: 300px;
  height: 200px;
  cursor: pointer;
  border-radius: 8px;
  overflow: hidden;
}

.minimal-shadow img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: all 0.4s ease;
  filter: grayscale(0);
}

.minimal-shadow::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(135deg, 
    rgba(0, 0, 0, 0) 0%,
    rgba(0, 0, 0, 0.1) 50%,
    rgba(0, 0, 0, 0.3) 100%);
  opacity: 0;
  transition: opacity 0.4s ease;
}

.minimal-shadow::after {
  content: '';
  position: absolute;
  bottom: -10px;
  left: 10px;
  right: 10px;
  height: 20px;
  background: rgba(0, 0, 0, 0.2);
  filter: blur(10px);
  transform: scaleY(0);
  transition: transform 0.4s ease;
  border-radius: 50%;
}

.minimal-shadow:hover img {
  filter: grayscale(0.2) contrast(1.1);
  transform: translateY(-5px);
}

.minimal-shadow:hover::before {
  opacity: 1;
}

.minimal-shadow:hover::after {
  transform: scaleY(1) scaleX(1.1);
}
/* 2 */
.monochrome-border {
  position: relative;
  width: 300px;
  height: 200px;
  cursor: pointer;
  border-radius: 6px;
  overflow: hidden;
}

.monochrome-border img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: all 0.5s ease;
  filter: brightness(1);
}

.monochrome-border::before {
  content: '';
  position: absolute;
  top: -3px;
  left: -3px;
  right: -3px;
  bottom: -3px;
  background: linear-gradient(45deg, 
    #333 0%, 
    #666 50%, 
    #333 100%);
  z-index: -1;
  border-radius: 8px;
  opacity: 0;
  transform: scale(0.95);
  transition: all 0.5s ease;
}

.monochrome-border::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  border: 2px solid transparent;
  border-radius: 6px;
  background: linear-gradient(45deg, #666, #999) border-box;
  -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: exclude;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.monochrome-border:hover img {
  filter: brightness(1.1) contrast(1.05);
  transform: scale(1.02);
}

.monochrome-border:hover::before {
  opacity: 1;
  transform: scale(1);
}

.monochrome-border:hover::after {
  opacity: 1;
}
/* 3 */
.grayscale-mask {
  position: relative;
  width: 300px;
  height: 200px;
  cursor: pointer;
  border-radius: 10px;
  overflow: hidden;
}

.grayscale-mask img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: all 0.6s ease;
  filter: grayscale(0);
}

.grayscale-mask::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255, 255, 255, 0.3) 50%,
    transparent 100%);
  transition: left 0.6s ease;
  z-index: 2;
}

.grayscale-mask::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: radial-gradient(circle at center,
    transparent 30%,
    rgba(0, 0, 0, 0.2) 70%);
  opacity: 0;
  transition: opacity 0.6s ease;
}

.grayscale-mask:hover img {
  filter: grayscale(0.3) brightness(1.1);
  transform: scale(1.05);
}

.grayscale-mask:hover::before {
  left: 100%;
}

.grayscale-mask:hover::after {
  opacity: 1;
}
/* 4 */
.simple-zoom {
  position: relative;
  width: 300px;
  height: 200px;
  cursor: pointer;
  border-radius: 12px;
  overflow: hidden;
  background: #f5f5f5;
}

.simple-zoom img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  filter: brightness(1) blur(0px);
}

.simple-zoom::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: all 0.5s ease;
  opacity: 0;
}

.simple-zoom:hover img {
  filter: brightness(0.8) blur(2px);
  transform: scale(1.1);
}

.simple-zoom:hover::before {
  width: 60px;
  height: 60px;
  opacity: 1;
  animation: simplePulse 2s infinite;
}

@keyframes simplePulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
  50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
}
/* 5 */
.minimal-lines {
  position: relative;
  width: 300px;
  height: 200px;
  cursor: pointer;
  border-radius: 8px;
  overflow: hidden;
}

.minimal-lines img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: all 0.4s ease;
  filter: contrast(1);
}

.minimal-lines::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg,
    transparent 0%,
    #333 50%,
    transparent 100%);
  transform: translateX(-100%);
  transition: transform 0.4s ease;
}

.minimal-lines::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg,
    transparent 0%,
    #333 50%,
    transparent 100%);
  transform: translateX(100%);
  transition: transform 0.4s ease 0.1s;
}

.minimal-lines:hover img {
  filter: contrast(1.1) brightness(1.05);
  transform: scale(1.02);
}

.minimal-lines:hover::before {
  transform: translateX(100%);
}

.minimal-lines:hover::after {
  transform: translateX(-100%);
}
/* 6 */
.white-glow {
  position: relative;
  width: 300px;
  height: 200px;
  cursor: pointer;
  border-radius: 10px;
  overflow: hidden;
}

.white-glow img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: all 0.5s ease;
  filter: brightness(1);
}

.white-glow::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle,
    rgba(255, 255, 255, 0.3) 0%,
    rgba(255, 255, 255, 0.1) 30%,
    transparent 50%);
  transform: scale(0);
  transition: transform 0.5s ease;
  opacity: 0;
}

.white-glow:hover img {
  filter: brightness(1.2) contrast(1.1);
}

.white-glow:hover::before {
  transform: scale(1);
  opacity: 1;
  animation: whiteGlow 2s infinite alternate;
}

@keyframes whiteGlow {
  0% { transform: scale(1) rotate(0deg); }
  100% { transform: scale(1.1) rotate(10deg); }
}

    </style>
</head>
<body>
    <!-- 極簡陰影漸變 -->
<div class="minimal-shadow">
  <img src="img1.png" alt="圖片">
</div>

<!-- 單色邊框擴散 -->
<div class="monochrome-border">
  <img src="img1.png" alt="圖片">
</div>

<!-- 黑白漸變遮罩 -->
<div class="grayscale-mask">
  <img src="img1.png" alt="圖片">
</div>

<!-- 簡約縮放效果 -->
<div class="simple-zoom">
  <img src="img1.png" alt="圖片">
</div>

<!-- 極簡線條效果 -->
<div class="minimal-lines">
  <img src="img1.png" alt="圖片">
</div>

<!-- 純白光暈效果 -->
<div class="white-glow">
  <img src="img1.png" alt="圖片">
</div>

</body>
</html>
