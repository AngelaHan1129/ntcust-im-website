<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .flip-card {
      width: 300px;
      height: 200px;
      perspective: 1000px;
      margin: 20px;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s;
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .flip-card:hover .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front,
    .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .flip-card-front {
      background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
    }

    .flip-card-back {
      background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
      transform: rotateY(180deg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
    }

    .flip-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 15px;
    }
  </style>
</head>

<body>
  <div class="flip-card">
    <div class="flip-card-inner">
      <div class="flip-card-front">
        <img src="img1.png" alt="圖片">
      </div>
      <div class="flip-card-back">
        <p>國泰人壽實習</p>
      </div>
    </div>
  </div>

</body>

</html>
