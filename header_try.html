<script>
  // 把0砍掉
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".mdate.before").forEach((el) => {
      let text = el.textContent.trim();
      if (text.endsWith("00:00")) {
        el.textContent = text.replace(/00:00$/, "").trim();
      }
    });
  });
  // 滑動效果
  document.addEventListener("DOMContentLoaded", () => {
    const header = document.querySelector("#Dyn_head header");
    const main = document.querySelector("#main-content");
    const headerHeight = header.offsetHeight;

    window.addEventListener("scroll", () => {
      let scrollTop = window.scrollY || document.documentElement.scrollTop;

      if (scrollTop > 0) {
        // 固定 Header
        header.style.setProperty("position", "fixed", "important");
        header.style.setProperty("top", "0", "important");
        header.style.setProperty("width", "100%", "important");

        // main 推下 header 高度
        main.style.setProperty("margin-top", headerHeight + "px", "important");
      } else {
        // 還原 Header
        header.style.setProperty("position", "relative", "important");
        main.style.setProperty("margin-top", "0", "important");
      }
    });
  });

  // 搜尋按鈕點擊事件

  // 顯示彈窗
  document.addEventListener("click", function (e) {
    if (e.target.closest(".searchBtn")) {
      document.getElementById("popupOverlay").style.display = "block";
    }
  });

  // 關閉彈窗
  document.getElementById("closePopup").addEventListener("click", function () {
    document.getElementById("popupOverlay").style.display = "none";
  });

  // 點擊遮罩區域也可以關閉
  document
    .getElementById("popupOverlay")
    .addEventListener("click", function (e) {
      if (e.target === this) {
        this.style.display = "none";
      }
    });

  // 你的原本搜尋送出函數
  function chkHeadSchToken_ae8b4ee3821190e8c1aedf834a90db90e() {
    document.HeadSearchForm_ae8b4ee3821190e8c1aedf834a90db90e.submit();
  }

  document.addEventListener("DOMContentLoaded", function () {
    function toggleMenuAbove() {
      const ulElement = document.querySelector(".hdmenu ul");
      const existingElement = document.querySelector("#link-section");

      if (window.innerWidth <= 768) {
        if (!existingElement) {
          ulElement.insertAdjacentHTML(
            "beforebegin",
            '<div class="header-top-right mobile" id="link-section">' +
              '<div class="link-bar">' +
              '<div class="link-bar-content">' +
              '<a href="/p/17-1063.php">網站導覽</a>' +
              '<a href="https://www.nutc.edu.tw/" target="_blank" rel="noreferrer">學校首頁</a>' +
              '<a href="https://coinformation.nutc.edu.tw/" target="_blank" rel="noreferrer">學院首頁</a>' +
              "</div>" +
              "</div>" +
              "</div>"
          );
        }
      } else {
        if (existingElement) {
          existingElement.remove();
        }
      }
    }

    // 使用 setTimeout 確保 DOM 完全載入
    setTimeout(() => {
      toggleMenuAbove();
    }, 100);

    // 視窗大小改變時檢查
    window.addEventListener("resize", function () {
      // 加入防抖動機制
      clearTimeout(window.resizeTimeout);
      window.resizeTimeout = setTimeout(toggleMenuAbove, 250);
    });
  });
</script>
